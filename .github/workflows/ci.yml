name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Unit, API, recovery, and performance tests
        run: python -m pytest -q tests/unit tests/performance
      - name: Collect live E2E tests without running them
        run: python -m pytest --collect-only -q tests/e2e
