name: ${COMPOSE_PROJECT_NAME:-enterprise-etl-quality}

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-postgres-healthcheck: &postgres-healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 10s

x-airflow-common: &airflow-common
  <<: *service-security
  image: ${AIRFLOW_PROJECT_IMAGE:-enterprise-etl-quality-airflow:3.3.1}
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
    args:
      AIRFLOW_BASE_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:3.3.1-python3.12}
  user: "${AIRFLOW_UID:-50000}:0"
  init: true
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__API__EXPOSE_CONFIG: "false"
    AIRFLOW__API__EXPOSE_STACKTRACE: "false"
    PYTHONPATH: /opt/airflow/project/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/config:/opt/airflow/config:ro
    - airflow_logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins:ro
    - ./config:/opt/airflow/project/config:ro
    - ./src:/opt/airflow/project/src:ro
  networks:
    - etl-backend

services:
  crm-postgres:
    <<: *service-security
    image: ${POSTGRES_IMAGE:-postgres:16.15-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CRM_POSTGRES_USER:?Set CRM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CRM_POSTGRES_PASSWORD:?Set CRM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CRM_POSTGRES_DB:?Set CRM_POSTGRES_DB}
    ports:
      - "127.0.0.1:${CRM_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
      - ./sql/postgresql/source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    networks:
      - etl-backend

  warehouse-postgres:
    <<: *service-security
    image: ${POSTGRES_IMAGE:-postgres:16.15-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:?Set WAREHOUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?Set WAREHOUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:?Set WAREHOUSE_POSTGRES_DB}
    ports:
      - "127.0.0.1:${WAREHOUSE_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data
      - ./sql/postgresql/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    networks:
      - etl-backend

  airflow-postgres:
    <<: *service-security
    image: ${POSTGRES_IMAGE:-postgres:16.15-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    networks:
      - etl-backend

  billing-sqlserver:
    <<: *service-security
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker/sqlserver/init:/opt/project/init:ro
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
    networks:
      - etl-backend

  billing-sqlserver-init:
    <<: *service-security
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04}
    platform: linux/amd64
    restart: "no"
    depends_on:
      billing-sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -C
      - -S
      - billing-sqlserver
      - -U
      - sa
      - -P
      - ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      - -b
      - -v
      - BillingUser=${MSSQL_APP_USER:?Set MSSQL_APP_USER}
      - BillingPassword=${MSSQL_APP_PASSWORD:?Set MSSQL_APP_PASSWORD}
      - -i
      - /opt/project/init/001_initialize.sql
    volumes:
      - ./docker/sqlserver/init:/opt/project/init:ro
      - ./sql/sqlserver/ddl:/opt/project/ddl:ro
      - ./data/raw/sqlserver:/opt/project/seed:ro
    networks:
      - etl-backend

  airflow-init:
    <<: *airflow-common
    restart: "no"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?Set AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.invalid}
    command: version

  airflow-api-server:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      billing-sqlserver-init:
        condition: service_completed_successfully
      crm-postgres:
        condition: service_healthy
      warehouse-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-environment
      CRM_POSTGRES_USER: ${CRM_POSTGRES_USER:?Set CRM_POSTGRES_USER}
      CRM_POSTGRES_PASSWORD: ${CRM_POSTGRES_PASSWORD:?Set CRM_POSTGRES_PASSWORD}
      CRM_POSTGRES_HOST: ${CRM_POSTGRES_HOST:-crm-postgres}
      CRM_POSTGRES_PORT: ${CRM_POSTGRES_PORT:-5432}
      CRM_POSTGRES_DB: ${CRM_POSTGRES_DB:?Set CRM_POSTGRES_DB}
      CRM_POSTGRES_SSL_MODE: ${CRM_POSTGRES_SSL_MODE:-disable}
      WAREHOUSE_POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:?Set WAREHOUSE_POSTGRES_USER}
      WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?Set WAREHOUSE_POSTGRES_PASSWORD}
      WAREHOUSE_POSTGRES_HOST: ${WAREHOUSE_POSTGRES_HOST:-warehouse-postgres}
      WAREHOUSE_POSTGRES_PORT: ${WAREHOUSE_POSTGRES_PORT:-5432}
      WAREHOUSE_POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:?Set WAREHOUSE_POSTGRES_DB}
      WAREHOUSE_POSTGRES_SSL_MODE: ${WAREHOUSE_POSTGRES_SSL_MODE:-disable}
      MSSQL_APP_USER: ${MSSQL_APP_USER:?Set MSSQL_APP_USER}
      MSSQL_APP_PASSWORD: ${MSSQL_APP_PASSWORD:?Set MSSQL_APP_PASSWORD}
      MSSQL_HOST: ${MSSQL_HOST:-billing-sqlserver}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-billing_source}
      MSSQL_ODBC_DRIVER: ${MSSQL_ODBC_DRIVER:-ODBC Driver 18 for SQL Server}
      MSSQL_ENCRYPT: ${MSSQL_ENCRYPT:-true}
      MSSQL_TRUST_SERVER_CERTIFICATE: ${MSSQL_TRUST_SERVER_CERTIFICATE:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
    command: scheduler
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]

  airflow-dag-processor:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]

networks:
  etl-backend:
    driver: bridge

volumes:
  crm_postgres_data:
  warehouse_postgres_data:
  airflow_postgres_data:
  sqlserver_data:
  airflow_logs:
